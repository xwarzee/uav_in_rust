# UAV Swarm Simulation Configuration

[simulation]
# Simulation mode: "internal" for Rust physics, "gazebo" for external Gazebo
mode = "internal"

# Update rate in Hz (10 Hz = 100ms between updates)
update_rate_hz = 10.0

[gazebo]
# URL of the Gazebo C++ plugin HTTP server on remote server
# For local testing: http://localhost:8092
# For remote server: http://SERVEUR_IP:8092 or http://gazebo.example.com:8092
bridge_url = "http://gazebo_server:8092"

# Whether Gazebo integration is enabled
enabled = true

# Auto-start sync when switching to Gazebo mode
auto_start = false

# HTTP request timeout in milliseconds (higher for remote servers)
timeout_ms = 15000

[ros2]
# URL of the ROS2 HTTP bridge node
# For local testing: http://localhost:8082
bridge_url = "http://localhost:8082"

# Whether ROS2 integration is enabled
enabled = false

# HTTP request timeout in milliseconds
timeout_ms = 5000
