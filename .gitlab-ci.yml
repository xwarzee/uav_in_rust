# GitLab CI/CD Pipeline for UAV Swarm System
#
# Pipeline Structure:
# 1. Build - Compile the project
# 2. Test Software - Run software unit and integration tests
# 3. Test MBSE - Run MBSE traceability and validation tests
# 4. Report - Generate traceability and coverage reports
#
# Git Configuration:
# - Repository is cloned automatically by GitLab Runner
# - Uses full clone (GIT_DEPTH: 0) for complete git history in reports
# - GIT_STRATEGY: fetch reuses existing clone and fetches updates
# - GIT_CLEAN_FLAGS: -ffdx ensures clean working directory
# - Some jobs override GIT_DEPTH: 1 for faster shallow clones

# Define pipeline stages
stages:
  - build
  - test-acceptance
  - test-software
  - test-mbse
  - report

# Global variables
variables:
  CARGO_HOME: ${CI_PROJECT_DIR}/.cargo
  RUST_VERSION: "1.92"
  # Git configuration for efficient cloning
  GIT_STRATEGY: fetch
  GIT_DEPTH: 0  # Full clone for complete git history (needed for git log in reports)
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_CLEAN_FLAGS: -ffdx

# Cache configuration to speed up builds
cache:
  key: ${CI_COMMIT_REF_SLUG}-v5
  paths:
    - .cargo/
    - target/
    - .cargo/bin/cargo-nextest

# Default configuration for all jobs
default:
  image: rust:${RUST_VERSION}
  before_script:
    # Display Git repository information
    - echo "🔍 Repository Information"
    - echo "  Repository URL:" "${CI_REPOSITORY_URL}"
    - echo "  Branch:" "${CI_COMMIT_REF_NAME}"
    - echo "  Commit:" "${CI_COMMIT_SHORT_SHA}"
    - echo "  Working directory:" "${CI_PROJECT_DIR}"
    - git --version
    - git rev-parse --verify HEAD
    - git status --short
    - echo ""
    # Display Rust toolchain information
    - echo "🦀 Rust Toolchain Information"
    - rustc --version
    - cargo --version
    # Install cargo-nextest if needed
    - |
      if ! command -v cargo-nextest &> /dev/null; then
        echo "📦 Installing cargo-nextest..."
        cargo install cargo-nextest --locked
      else
        echo "✅ cargo-nextest already installed (cached)"
        cargo nextest --version
      fi

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# STAGE 1: BUILD
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Validate repository clone and structure
validate:repo:
  stage: build
  variables:
    GIT_DEPTH: 1  # Shallow clone for quick validation
  script:
    - echo "🔍 Validating repository structure..."
    - test -f Cargo.toml || (echo "❌ Cargo.toml not found" && exit 1)
    - test -d src || (echo "❌ src directory not found" && exit 1)
    - test -d tests || (echo "❌ tests directory not found" && exit 1)
    - test -f .gitlab-ci.yml || (echo "❌ .gitlab-ci.yml not found" && exit 1)
    - echo "✅ Repository structure validated"
    - echo "📦 Checking Cargo project..."
    - cargo --version
    - cargo verify-project || (echo "❌ Invalid Cargo project" && exit 1)
    - echo "✅ Valid Cargo project"
    - echo "📊 Project statistics:"
    - echo "  Rust files:" "$(find src -name '*.rs' | wc -l)"
    - echo "  Test files:" "$(find tests -name '*.rs' | wc -l)"
    - echo "  Total lines:" "$(find src tests -name '*.rs' -exec cat {} \; | wc -l)"
  only:
    - branches
    - merge_requests
    - main
    - tags

build:debug:
  stage: build
  variables:
    GIT_DEPTH: 1  # Shallow clone for faster builds
  script:
    - echo "🔨 Building project in debug mode..."
    - cargo build --verbose
    - echo "✅ Debug build completed"
  artifacts:
    paths:
      - target/debug/uav_swarm
    expire_in: 1 hour
  only:
    - branches
    - merge_requests

build:release:
  stage: build
  variables:
    GIT_DEPTH: 1  # Shallow clone for faster builds
  script:
    - echo "🔨 Building project in release mode..."
    - cargo build --release --verbose
    - echo "✅ Release build completed"
  artifacts:
    paths:
      - target/release/uav_swarm
    expire_in: 1 day
  only:
    - main
    - tags

# Check code formatting
format:check:
  stage: build
  variables:
    GIT_DEPTH: 1  # Shallow clone sufficient for formatting check
  script:
    - rustup component add rustfmt
    - echo "🎨 Checking code formatting..."
    - cargo fmt -- --check
    - echo "✅ Code formatting is correct"
  allow_failure: true
  only:
    - merge_requests

# Run clippy for linting
lint:clippy:
  stage: build
  variables:
    GIT_DEPTH: 1  # Shallow clone sufficient for linting
  script:
    - rustup component add clippy
    - echo "🔍 Running Clippy linter..."
    - cargo clippy -- -D warnings
    - echo "✅ No clippy warnings"
  allow_failure: true
  only:
    - merge_requests

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# STAGE 2: SOFTWARE TESTS (Traditional Software Testing)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Software Unit Tests (fast feedback)
test:software:unit:
  stage: test-software
  variables:
    GIT_DEPTH: 1  # Shallow clone for faster test execution
  script:
    - echo "🧪 Running Software Unit Tests..."
    - cargo nextest run --test software --profile ci -E 'test(unit_tests::)' --verbose 
    - mv target/nextest/ci/junit.xml target/nextest/junit-software-unit.xml
    - echo "✅ Software unit tests passed"
  dependencies:
    - build:debug
  coverage: '/\d+.\d+% coverage/'
  artifacts:
    reports:
      junit: target/nextest/junit-software-unit.xml
    paths:
      - target/nextest/junit-software-unit.xml
    when: always
    expire_in: 7 days
  only:
    - branches
    - merge_requests
    - main

# Software Integration Tests
test:software:integration:
  stage: test-software
  variables:
    GIT_DEPTH: 1  # Shallow clone for faster test execution
  script:
    - echo "🔗 Running Software Integration Tests..."
    - cargo nextest run --test software --profile ci -E 'test(integration_tests::)' --verbose
    - mv target/nextest/ci/junit.xml target/nextest/junit-software-integration.xml
    - echo "✅ Software integration tests passed"
  dependencies:
    - build:debug
  artifacts:
    reports:
      junit: target/nextest/junit-software-integration.xml
    paths:
      - target/nextest/junit-software-integration.xml
    when: always
    expire_in: 7 days
  only:
    - branches
    - merge_requests
    - main

# Run all software tests together (for main branch)
test:software:all:
  stage: test-software
  variables:
    GIT_DEPTH: 1  # Shallow clone for faster test execution
  script:
    - echo "🧪 Running ALL Software Tests..."
    - cargo nextest run --test software --profile ci --verbose
    - mv target/nextest/ci/junit.xml target/nextest/junit-software-all.xml
    - echo "✅ All software tests passed"
  dependencies:
    - build:debug
  artifacts:
    reports:
      junit: target/nextest/junit-software-all.xml
    paths:
      - target/nextest/junit-software-all.xml
    when: always
    expire_in: 7 days
  only:
    - main
    - tags

test:software:acceptance:
  stage: test-acceptance
  variables:
    GIT_DEPTH: 1  # Shallow clone for faster test execution
  before_script:
    - apt-get update && apt-get -y install maven # openjdk-21-jdk installé avec maven
#    - apt-get -y install xsltproc # used to convert FitNesse XML tests results to JUnit XML
  script:
    - echo "🧪 Running Acceptance Tests..."
    - cargo run -- serve --port 8080 &
    - cd fitnesse/fixtures && mvn clean install
    - cd ..
    - |
      echo "Waiting REST server is ready..."
      for i in {1..30}; do
        if curl -s http://localhost:8080/health > /dev/null; then
          echo "Serveur prêt !"
          break
        fi
        echo "Tentative $i/30..."
        sleep 2
      done
#    - mkdir target && ./run-fitnesse.sh target/fitnesse-results
#    - xsltproc fitnesse-to-junit.xsl target/fitnesse-results.xml > target/junit-software-acceptance.xml
    - mvn clean test -Pfitnesse-tests
    - ls -l target
    - echo "✅ All Acceptance tests passed"
  dependencies:
    - build:debug
  artifacts:
    reports:
      junit: fitnesse/target/surefire-reports/TEST-FitNesseRunnerTest.xml
    expose_as: 'Detailled FitNesse Reports'
    paths:
      - fitnesse/target/fitnesse-reports/
    when: always
    expire_in: 7 days
  only:
    - main
    - tags
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# STAGE 3: MBSE TRACEABILITY TESTS (Model-Based Systems Engineering)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# MBSE Component Mapping Tests
test:mbse:components:
