ros2_http_bridge:
  ros__parameters:
    # Port on which the HTTP REST server listens.
    # Must match ros2.bridge_url in config/simulation.toml.
    http_port: 8082

    # Gazebo world name (must match the <world name="..."> in the SDF file).
    world_name: "uav_swarm_world"

    # List of drone model names as declared in the SDF world.
    # Extend this list when adding drones (must also match --drones N in Rust CLI).
    drone_ids:
      - "drone_1"
      - "drone_2"
      - "drone_3"

    # Maximum drone speed in metres/second.
    # Each control tick (10 Hz) moves the drone by at most max_speed * 0.1 m.
    # Increase for faster movement, decrease for smoother slow motion.
    max_speed: 5.0

    # Distance in metres at which a drone is considered to have arrived at its target.
    arrival_threshold: 0.1
